<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>摄像头互动打地鼠</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%238FD16F'/%3E%3Ccircle cx='32' cy='30' r='13' fill='%235C4033'/%3E%3Ccircle cx='27' cy='27' r='2.6' fill='%23FFF'/%3E%3Ccircle cx='37' cy='27' r='2.6' fill='%23FFF'/%3E%3Cpath d='M25 35h14' stroke='%23FFF' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
    <!-- 引入 MediaPipe -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <!-- 引入 Tone.js 用于音乐（jsDelivr 主源，cdnjs 兜底） -->
    <script>
      function loadToneFallback(){
        var s = document.createElement('script');
        s.src = 'https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js';
        s.crossOrigin = 'anonymous';
        document.head.appendChild(s);
      }
    </script>
    <script src="https://fastly.jsdelivr.net/npm/tone@14.8.49/build/Tone.js" onerror="loadToneFallback()" crossorigin="anonymous"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background-color: #8FD16F; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; }
        #videoElement { display: none; }
        #canvasElement { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; z-index: -1; transform: scaleX(-1); opacity: 0.3; }
        
        #uiContainer { position: absolute; top: 20px; text-align: center; z-index: 10; color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        h1 { margin: 0 0 10px 0; font-size: 2rem; }
        #scoreBoard { font-size: 1.5rem; font-weight: bold; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 20px; }
        
        #gameBoard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 120px; width: 80vw; max-width: 600px; z-index: 5; }
        .hole { background-color: #5C4033; border-radius: 50%; height: 120px; position: relative; overflow: hidden; box-shadow: inset 0 10px 20px rgba(0,0,0,0.5); border: 5px solid #3e2b22; }
        
        .mole { 
            position: absolute; 
            bottom: -100%; 
            left: 10%; 
            width: 80%; 
            height: 100%; 
            background-image: url('assets/mole.png'); 
            background-size: contain; 
            background-position: center bottom; 
            background-repeat: no-repeat; 
            transition: bottom 0.2s ease-out; 
            border-radius: 50% 50% 0 0;
            background-color: transparent; /* 确保背景透明 */
        }
        
        .mole.bomb {
            background-image: url('assets/bomb.png');
        }
        .mole.up { bottom: 0; }
        
        .cursor { position: absolute; width: 20px; height: 20px; border-radius: 50%; pointer-events: none; z-index: 100; transform: translate(-50%, -50%); transition: transform 0.05s; }
        #cursor1 { background-color: rgba(255, 0, 0, 0.7); box-shadow: 0 0 10px red; }
        #cursor2 { background-color: rgba(0, 150, 255, 0.7); box-shadow: 0 0 10px blue; display: none; }
        
        #startBtn, #retryBtn { padding: 15px 30px; font-size: 1.2rem; background-color: #FF9800; color: white; border: none; border-radius: 30px; cursor: pointer; margin-top: 20px; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.1s; }
        #startBtn:active, #retryBtn:active { transform: scale(0.95); }
        
        #errorMsg { color: #ffcccc; background: rgba(255,0,0,0.8); padding: 10px; border-radius: 8px; margin-top: 10px; display: none; font-size: 14px; max-width: 400px;}
    </style>
</head>
<body>
    <video id="videoElement" autoplay playsinline></video>
    <canvas id="canvasElement"></canvas>
    <div id="uiContainer">
        <h1>🌻 花园打地鼠 (双人版)</h1>
        <div id="scoreBoard">分数: <span id="score">0</span></div>
        <button id="startBtn">启动摄像头并开始</button>
        <div id="errorMsg"></div>
        <button id="retryBtn" style="display: none;">重新连接摄像头</button>
    </div>
    <div id="gameBoard">
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
        <div class="hole"><div class="mole"></div></div>
    </div>
    <div id="cursor1" class="cursor"></div>
    <div id="cursor2" class="cursor"></div>
    <script>
        const videoElement = document.getElementById('videoElement');
        const canvasElement = document.getElementById('canvasElement');
        const canvasCtx = canvasElement.getContext('2d');
        const scoreElement = document.getElementById('score');
        const scoreBoard = document.getElementById('scoreBoard');
        const startBtn = document.getElementById('startBtn');
        const retryBtn = document.getElementById('retryBtn');
        const errorMsg = document.getElementById('errorMsg');
        const cursor1 = document.getElementById('cursor1');
        const cursor2 = document.getElementById('cursor2');
        const holes = document.querySelectorAll('.hole');
        
        let score = 0;
        let lastHole;
        let timeUp = false;
        let isProcessing = false; // 防卡死机制
        let camera;
        let synth, bombSynth;
        // --- 音乐系统 ---
        async function initAudio() {
            await Tone.start();
            // 轻松的背景和弦
            const polySynth = new Tone.PolySynth().toDestination();
            polySynth.volume.value = -10;
            const chords = [
                ['C4', 'E4', 'G4'],
                ['F4', 'A4', 'C5'],
                ['G4', 'B4', 'D5'],
                ['C4', 'E4', 'G4']
            ];
            let chordIndex = 0;
            Tone.Transport.scheduleRepeat((time) => {
                polySynth.triggerAttackRelease(chords[chordIndex], "4n", time);
                chordIndex = (chordIndex + 1) % chords.length;
            }, "2n");
            Tone.Transport.start();
            // 敲击音效
            synth = new Tone.Synth({ oscillator: { type: "sine" } }).toDestination();
            synth.volume.value = -5;
            
            // 爆炸音效
            bombSynth = new Tone.MembraneSynth().toDestination();
            bombSynth.volume.value = 5;
        }
        // --- 游戏逻辑 ---
        function randomTime(min, max) {
            return Math.round(Math.random() * (max - min) + min);
        }
        function randomHole(holes) {
            const idx = Math.floor(Math.random() * holes.length);
            const hole = holes[idx];
            if (hole === lastHole) return randomHole(holes);
            lastHole = hole;
            return hole;
        }
        function peep() {
            if (timeUp) return;
            const time = randomTime(800, 1500);
            const hole = randomHole(holes);
            const mole = hole.querySelector('.mole');
            
            // 30% 概率生成炸弹
            const isBomb = Math.random() < 0.3;
            if (isBomb) {
                mole.classList.add('bomb');
            } else {
                mole.classList.remove('bomb');
            }
            
            mole.classList.add('up');
            mole.dataset.hittable = 'true';
            setTimeout(() => {
                mole.classList.remove('up');
                mole.dataset.hittable = 'false';
                if (!timeUp) peep();
            }, time);
        }
        function startGame() {
            scoreBoard.style.display = 'block';
            score = 0;
            scoreElement.textContent = score;
            timeUp = false;
            if (window.Tone) { initAudio().catch(function(){ console.warn('音频初始化失败，游戏继续运行'); }); }
            peep();
            setTimeout(() => { timeUp = true; alert("时间到！你的得分是: " + score); }, 30000);
        }
        // --- 碰撞检测 ---
        function checkCollision(cursorX, cursorY) {
            if (timeUp) return;
            holes.forEach(hole => {
                const mole = hole.querySelector('.mole');
                if (mole.classList.contains('up') && mole.dataset.hittable === 'true') {
                    const rect = mole.getBoundingClientRect();
                    if (cursorX > rect.left && cursorX < rect.right && 
                        cursorY > rect.top && cursorY < rect.bottom) {
                        
                        mole.dataset.hittable = 'false';
                        mole.classList.remove('up');
                        
                        if (mole.classList.contains('bomb')) {
                            score -= 5;
                            if(bombSynth) bombSynth.triggerAttackRelease("C1", "8n");
                        } else {
                            score++;
                            if(synth) synth.triggerAttackRelease("C6", "16n");
                        }
                        
                        scoreElement.textContent = score;
                    }
                }
            });
        }
        // --- 摄像头与双手 AI ---
        function onResults(results) {
            isProcessing = false; // 允许处理下一帧
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);
            cursor1.style.display = 'none';
            cursor2.style.display = 'none';
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                results.multiHandLandmarks.forEach((landmarks, index) => {
                    // 食指指尖 (标志点 8)
                    const indexFingerTip = landmarks[8];
                    
                    // 因为做了 transform: scaleX(-1) 镜像翻转，计算 X 坐标时要用 1 - x
                    const rawX = 1 - indexFingerTip.x;
                    const rawY = indexFingerTip.y;
                    
                    const screenX = rawX * window.innerWidth;
                    const screenY = rawY * window.innerHeight;
                    const activeCursor = (index === 0) ? cursor1 : cursor2;
                    activeCursor.style.display = 'block';
                    activeCursor.style.left = `${screenX}px`;
                    activeCursor.style.top = `${screenY}px`;
                    checkCollision(screenX, screenY);
                });
            }
            canvasCtx.restore();
        }
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });
        
        hands.setOptions({
            maxNumHands: 2,           // 支持两只手
            modelComplexity: 0,       // 0 为最快模型，防止卡顿
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        
        hands.onResults(onResults);
        async function initCamera() {
            startBtn.style.display = 'none';
            retryBtn.style.display = 'none';
            errorMsg.style.display = 'none';
            
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
            try {
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        // 丢帧防卡死机制
                        if (isProcessing) return; 
                        isProcessing = true;
                        await hands.send({image: videoElement});
                    },
                    width: 640,
                    height: 480
                });
                await camera.start();
                startGame();
            } catch (error) {
                console.error("Camera Error:", error);
                errorMsg.style.display = 'block';
                retryBtn.style.display = 'inline-block';
                if (error.name === 'NotReadableError') {
                    errorMsg.innerHTML = "<b>无法读取摄像头！</b><br>摄像头可能被其他软件（如Zoom、OBS或另一个网页标签）占用了。请关闭占用摄像头的程序后重试。";
                } else {
                    errorMsg.textContent = "无法访问摄像头，请确保已授予权限，或在本地环境 (localhost) / HTTPS 下运行。";
                }
                startBtn.style.display = 'inline-block';
            }
        }
        startBtn.addEventListener('click', initCamera);
        retryBtn.addEventListener('click', initCamera);
    </script>
</body>
</html>
